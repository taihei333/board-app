openapi: 3.0.3

info:
  title: 掲示板API
  description:  |
    ## 掲示板のCRUDを行うAPI
    ### 機能
      1. ログイン
      2. 会員登録
      3. ログインユーザー情報取得
      4. 記事一覧取得：ページネーション・検索
      5. 記事登録
      6. 記事詳細取得
      7. 記事更新
      8. 記事削除
      9. コメント登録
    ---
    ※ログインAPI、ログインユーザー情報取得APIを参考に残りのAPI設計をしてください。
  version: 1.0.0

servers:
  - url: 'http://localhost:{port}/api/{version}'
    description: 開発環境サーバー
    variables:
      port:
        enum:
          - '8080'
        default: '8080'
      version:
        enum:
          - 'v1'
        default: 'v1'

paths:
  /login:
    post:
      summary: ログイン
      description: |
        ログインしてJWTトークンを取得する
        ### 一般ユーザー
        - メールアドレス：user@example.com
        - パスワード: password123
        ### 管理者ユーザー
        - メールアドレス：admin@example.com
        - パスワード: password123
      tags:
        - login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
              example:
                email: user@example.com
                password: password123
      responses:
        200:
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c2VyQGV4YW1wbGUuY29tIiwiaWF0IjoxNzU0NDQ2MjE5LCJleHAiOjE3NTQ1MzI2MTl9.bShS5MTrU0iuULlmF2fJ-lTzInoF-9kJ14Fxmu2wQJE5F4xP_Z0r6cvLVkMxhFNe5e43agUtXzdrVBpuw7YrEQ
                  type:
                    type: string
                    example: Bearer
                  id:
                    type: integer
                    example: 1
                  email:
                    type: string
                    example: user@example.com
        400:
          $ref: '#/components/responses/400-BadRequest'
        500:
          $ref: '#/components/responses/500-InternalServerError'

  /signup:
    post:
      summary: 会員登録
      description: |
        新しいユーザーアカウントを登録する
      tags:
        - signup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 255
                name:
                  type: string
                  maxLength: 10
                password:
                  type: string
                  minLength: 8
                  maxLength: 32
                  pattern: '^[a-zA-Z0-9]+$'
                passwordConfirmation:
                  type: string
              required:
                - email
                - name
                - password
                - passwordConfirmation
              example:
                email: user@example.com
                name: 山田太郎
                password: password123
                passwordConfirmation: password123
      responses:
        201:
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 山田太郎
                  email:
                    type: string
                    example: user@example.com
        400:
          $ref: '#/components/responses/400-BadRequest'
        500:
          $ref: '#/components/responses/500-InternalServerError'

  /me:
    get:
      summary: ログインユーザー情報取得
      description: JWT認証済みユーザーのnameとemailを返す
      tags:
        - user
      security:
        - bearerAuth: []
      responses:
        200:
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: user
                  email:
                    type: string
                    example: user@example.com
        401:
          $ref: '#/components/responses/401-Unauthorized'
        500:
          $ref: '#/components/responses/500-InternalServerError'

  /articles:
    get:
      summary: 記事一覧取得
      description: ページネーション・検索・ソート機能付きで記事一覧を取得する
      tags:
        - article
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: ページ番号（1始まり）
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: 1ページあたりの件数
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: title
          in: query
          description: タイトルの部分一致検索
          required: false
          schema:
            type: string
        - name: content
          in: query
          description: 本文の部分一致検索
          required: false
          schema:
            type: string
        - name: authorName
          in: query
          description: 投稿者名の部分一致検索
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          description: ソート対象カラム
          required: false
          schema:
            type: string
            enum: [createdAt, title]
            default: createdAt
        - name: order
          in: query
          description: ソート順
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        200:
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 101
                        title:
                          type: string
                          example: 初めての投稿です
                        authorName:
                          type: string
                          example: 山田太郎
                        createdAt:
                          type: string
                          format: date-time
                          example: "2026-08-01T10:15:00+09:00"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        example: 1
                      size:
                        type: integer
                        example: 20
                      totalElements:
                        type: integer
                        example: 42
                      totalPages:
                        type: integer
                        example: 3
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        500:
          $ref: '#/components/responses/500-InternalServerError'

    post:
      summary: 記事登録
      description: 新しい記事を登録する
      tags:
        - article
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 50
                content:
                  type: string
                  minLength: 1
                  maxLength: 10000
              required:
                - title
                - content
              example:
                title: 初めての投稿です
                content: 本文の内容がここに入ります。
      responses:
        201:
          description: 作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 101
                  title:
                    type: string
                    example: 初めての投稿です
                  content:
                    type: string
                    example: 本文の内容がここに入ります。
                  authorId:
                    type: integer
                    example: 1
                  authorName:
                    type: string
                    example: 山田太郎
                  createdAt:
                    type: string
                    format: date-time
                    example: "2026-08-01T10:15:00+09:00"
                  updatedAt:
                    type: string
                    format: date-time
                    example: "2026-08-01T10:15:00+09:00"
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        500:
          $ref: '#/components/responses/500-InternalServerError'

  /articles/{articleId}:
    parameters:
      - name: articleId
        in: path
        required: true
        description: 記事ID
        schema:
          type: integer

    get:
      summary: 記事詳細取得
      description: 指定されたIDの記事詳細と、紐づくコメント一覧を取得する
      tags:
        - article
      security:
        - bearerAuth: []
      responses:
        200:
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 101
                  title:
                    type: string
                    example: 初めての投稿です
                  content:
                    type: string
                    example: 本文の内容がここに入ります。
                  authorId:
                    type: integer
                    example: 1
                  authorName:
                    type: string
                    example: 山田太郎
                  createdAt:
                    type: string
                    format: date-time
                    example: "2026-08-01T10:15:00+09:00"
                  updatedAt:
                    type: string
                    format: date-time
                    example: "2026-08-01T10:15:00+09:00"
                  comments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 501
                        authorId:
                          type: integer
                          example: 2
                        authorName:
                          type: string
                          example: 佐藤花子
                        content:
                          type: string
                          example: 参考になりました！
                        createdAt:
                          type: string
                          format: date-time
                          example: "2026-08-02T09:00:00+09:00"
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        500:
          $ref: '#/components/responses/500-InternalServerError'

    put:
      summary: 記事更新
      description: 指定されたIDの記事を更新する（投稿者本人のみ）
      tags:
        - article
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 50
                content:
                  type: string
                  minLength: 1
                  maxLength: 10000
              required:
                - title
                - content
              example:
                title: タイトルを更新しました
                content: 本文を更新しました。
      responses:
        200:
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 101
                  title:
                    type: string
                    example: タイトルを更新しました
                  content:
                    type: string
                    example: 本文を更新しました。
                  authorId:
                    type: integer
                    example: 1
                  authorName:
                    type: string
                    example: 山田太郎
                  createdAt:
                    type: string
                    format: date-time
                    example: "2026-08-01T10:15:00+09:00"
                  updatedAt:
                    type: string
                    format: date-time
                    example: "2026-08-03T12:00:00+09:00"
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        403:
          $ref: '#/components/responses/403-Forbidden'
        404:
          $ref: '#/components/responses/404-NotFound'
        500:
          $ref: '#/components/responses/500-InternalServerError'

    delete:
      summary: 記事削除
      description: 指定されたIDの記事を削除する（投稿者本人のみ）
      tags:
        - article
      security:
        - bearerAuth: []
      responses:
        204:
          description: 削除成功（レスポンスボディなし）
        401:
          $ref: '#/components/responses/401-Unauthorized'
        403:
          $ref: '#/components/responses/403-Forbidden'
        404:
          $ref: '#/components/responses/404-NotFound'
        500:
          $ref: '#/components/responses/500-InternalServerError'

  /articles/{articleId}/comments:
    parameters:
      - name: articleId
        in: path
        required: true
        description: コメント対象の記事ID
        schema:
          type: integer

    post:
      summary: コメント登録
      description: 指定された記事にコメントを登録する
      tags:
        - comment
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required:
                - content
              example:
                content: 参考になりました！
      responses:
        201:
          description: 作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 501
                  articleId:
                    type: integer
                    example: 101
                  authorId:
                    type: integer
                    example: 2
                  authorName:
                    type: string
                    example: 佐藤花子
                  content:
                    type: string
                    example: 参考になりました！
                  createdAt:
                    type: string
                    format: date-time
                    example: "2026-08-02T09:00:00+09:00"
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        500:
          $ref: '#/components/responses/500-InternalServerError'

components:
  responses:
    400-BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 入力内容にエラーがあります
              field_errors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      example: email
                    message:
                      type: string
                      example: Email is required
    401-Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthorized
            required:
              - message
    403-Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Forbidden
            required:
              - message
    404-NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Not Found
            required:
              - message
    500-InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Internal Server Error
            required:
              - message
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT？