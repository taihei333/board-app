name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: ./gradlew clean bootJar

      - name: Upload jar to EC2 (/tmp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/bbs-api-0.0.1-SNAPSHOT.jar"
          target: "/tmp"
          strip_components: 2

      - name: Deploy on EC2 (backup, swap, restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo cp /opt/bbs-api/bbs-api-0.0.1-SNAPSHOT.jar \
                    /opt/bbs-api/bbs-api-0.0.1-SNAPSHOT.jar.bak.$(date +%Y%m%d%H%M%S)
            sudo systemctl stop bbs-api
            sudo mv /tmp/bbs-api-0.0.1-SNAPSHOT.jar /opt/bbs-api/bbs-api-0.0.1-SNAPSHOT.jar
            sudo chown root:root /opt/bbs-api/bbs-api-0.0.1-SNAPSHOT.jar
            sudo systemctl start bbs-api
            sleep 5
            sudo systemctl is-active --quiet bbs-api && echo "Deploy succeeded" || (echo "Deploy failed, service not active" && exit 1)
